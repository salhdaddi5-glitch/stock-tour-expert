<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Tour Expert — إدارة المخزون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- Firebase -->

<style>
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; min-height: 100%; }
  body { font-family: 'IBM Plex Sans', sans-serif; }
  .font-display { font-family: 'Space Grotesk', sans-serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(227,165,72,0.65); }
    50% { box-shadow: 0 0 0 10px rgba(227,165,72,0); }
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:translateY(0);} }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.2); }
  }
  @keyframes longPulse {
    0%, 100% { 
      box-shadow: 0 0 0 0 rgba(227,165,72,0.8);
      transform: scale(1);
    }
    50% { 
      box-shadow: 0 0 0 15px rgba(227,165,72,0);
      transform: scale(1.1);
    }
  }
  .fade-up { animation: fadeUp .25s ease both; }
  .glow-target { animation: pulseGlow 1.1s ease-out 4; }
  .glow-long { animation: longPulse 1.5s ease-in-out infinite; }
  .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a4150; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Responsive Design */
  @media (max-width: 768px) {
    .warehouse-map-container {
      padding: 16px 10px !important;
    }
    .shelf-block {
      transform: scale(0.85);
      transform-origin: top center;
    }
    .detail-panel {
      width: 100% !important;
      max-width: 100% !important;
    }
    .top-bar {
      padding: 10px 12px !important;
    }
    .nav-buttons {
      flex-wrap: wrap;
    }
    .search-container {
      min-width: 150px !important;
    }
    .main-content {
      padding: 16px 12px 80px !important;
    }
    .kpi-grid {
      grid-template-columns: repeat(2, 1fr) !important;
    }
    .dashboard-grid {
      grid-template-columns: 1fr !important;
    }
  }

  @media (min-width: 769px) and (max-width: 1024px) {
    .shelf-block {
      transform: scale(0.95);
      transform-origin: top center;
    }
    .detail-panel {
      width: 380px !important;
    }
  }

  @media (min-width: 1025px) {
    .detail-panel {
      width: 420px !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

try {

/* =========================================================================
   ICONS
   ========================================================================= */
function Icon({ name, size = 16, color = "currentColor", style }) {
  const p = { fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  const wrap = (children) => (
    <svg width={size} height={size} viewBox="0 0 24 24" style={style} {...p}>{children}</svg>
  );
  switch (name) {
    case "door": return wrap(<><path d="M3 21h18"/><path d="M5 21V5a2 2 0 0 1 2-2h7l5 4v14"/><circle cx="15" cy="12" r="1" fill={color}/></>);
    case "search": return wrap(<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>);
    case "x": return wrap(<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>);
    case "box": return wrap(<><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>);
    case "boxes": return wrap(<><path d="M2.5 8.5L8 6l5.5 2.5v6L8 17l-5.5-2.5z"/><path d="M8 6v11"/><path d="M13.5 9.5L16 8.3l4.5 2v5L16 17.5l-2.5-1.1"/></>);
    case "plus": return wrap(<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>);
    case "minus": return wrap(<line x1="5" y1="12" x2="19" y2="12"/>);
    case "camera": return wrap(<><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></>);
    case "history": return wrap(<><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M3 3v5h5"/><polyline points="12 7 12 12 15 15"/></>);
    case "grid": return wrap(<><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></>);
    case "map": return wrap(<><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></>);
    case "alert": return wrap(<><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>);
    case "trending": return wrap(<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>);
    case "user": return wrap(<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>);
    case "logout": return wrap(<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>);
    case "moon": return wrap(<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>);
    case "sun": return wrap(<><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></>);
    case "chevronRight": return wrap(<polyline points="9 18 15 12 9 6"/>);
    case "check": return wrap(<polyline points="20 6 9 17 4 12"/>);
    case "scan": return wrap(<><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></>);
    case "clock": return wrap(<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>);
    case "pin": return wrap(<><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></>);
    case "shield": return wrap(<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>);
    case "hardhat": return wrap(<><path d="M4 18v-2a8 8 0 0 1 16 0v2"/><path d="M2 18h20"/><path d="M12 8V4"/></>);
    case "edit": return wrap(<><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>);
    case "trash": return wrap(<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>);
    case "package": return wrap(<><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>);
    default: return wrap(<circle cx="12" cy="12" r="9"/>);
  }
}

/* =========================================================================
   WAREHOUSE TOPOLOGY
   الترتيب الجديد: F (الأقرب للمدخل), A, B, C, D, E, G (الأبعد/المقابل للمدخل)
   ========================================================================= */
const SHELVES = [
  { id: "F", columns: 5, sides: 1 },  // الأقرب لحائط المدخل
  { id: "A", columns: 6, sides: 1 },
  { id: "B", columns: 4, sides: 2 },
  { id: "C", columns: 4, sides: 2 },
  { id: "D", columns: 3, sides: 2 },
  { id: "E", columns: 5, sides: 1 },
  { id: "G", columns: 5, sides: 1 },  // المقابل للمدخل
];
const LEVELS = 5;
const LOW_STOCK_THRESHOLD = 6;

const ALL_LOCATIONS = SHELVES.flatMap((s) => {
  if (s.sides === 2) {
    const front = Array.from({ length: s.columns }, (_, c) =>
      Array.from({ length: LEVELS }, (_, l) => `${s.id}أ${c + 1}-${l + 1}`)
    ).flat();
    const back = Array.from({ length: s.columns }, (_, c) =>
      Array.from({ length: LEVELS }, (_, l) => `${s.id}خ${c + 1}-${l + 1}`)
    ).flat();
    return [...front, ...back];
  }
  return Array.from({ length: s.columns }, (_, c) =>
    Array.from({ length: LEVELS }, (_, l) => `${s.id}${c + 1}-${l + 1}`)
  ).flat();
});

const totalQty = (p) => p.locations.reduce((s, l) => s + l.qty, 0);
const timesUsed = (p) => p.history.reduce((s, h) => s + (h.action === "REMOVE" ? h.qty : 0), 0);

/* =========================================================================
   THEME
   ========================================================================= */
const THEMES = {
  dark: {
    bg: "#0A0C10", surface: "#14181F", surface2: "#1B2029", border: "#262C36",
    text: "#ECEEF1", muted: "#8B92A0", gold: "#E3A548", goldBright: "#F4C874",
    green: "#3ECF8E", red: "#F0555F", gray: "#454C57", floor: "#111722",
  },
  light: {
    bg: "#F5F3EE", surface: "#FFFFFF", surface2: "#F0EDE5", border: "#E1DCCF",
    text: "#191712", muted: "#6B6558", gold: "#B9781F", goldBright: "#D8983A",
    green: "#1C9A6C", red: "#C43A42", gray: "#B7B0A0", floor: "#EAE6DA",
  },
};

/* =========================================================================
   ROOT APP
   ========================================================================= */
function WarehouseApp() {
  const [ready, setReady] = useState(false);
  const [session, setSession] = useState(null);
  const [dark, setDark] = useState(true);
  const T = dark ? THEMES.dark : THEMES.light;

  const [products, setProducts] = useState([]);
  const [view, setView] = useState("map");
  const [selectedLoc, setSelectedLoc] = useState(null);
  const [searchHighlight, setSearchHighlight] = useState(null);
  const [glowTimeout, setGlowTimeout] = useState(null);
  const [scannerOpen, setScannerOpen] = useState(false);
  const [scanCallback, setScanCallback] = useState(null);
  const [scanResult, setScanResult] = useState(null);
  const [toast, setToast] = useState(null);
  const [syncStatus, setSyncStatus] = useState("idle");

  useEffect(() => {
    let unsubscribe;
    
    (async () => {
      try {
        if (firebaseReady && db) {
          unsubscribe = db.collection("products").onSnapshot((snapshot) => {
            const productsData = [];
            snapshot.forEach((doc) => {
              productsData.push({ id: doc.id, ...doc.data() });
            });
            setProducts(productsData);
            setSyncStatus("synced");
          }, (error) => {
            console.error("Firebase error:", error);
            setSyncStatus("error");
          });
        } else {
          setSyncStatus("error");
        }
        
        const s = localStorage.getItem("wh-session");
        if (s) setSession(JSON.parse(s));
        
        setReady(true);
      } catch (err) {
        console.error("Initialization error:", err);
        setReady(true);
      }
    })();
    
    return () => {
      if (unsubscribe) unsubscribe();
    };
  }, []);

  const showToast = useCallback((msg, kind = "ok") => {
    setToast({ msg, kind, id: Date.now() });
    setTimeout(() => setToast((t) => (t && t.msg === msg ? null : t)), 2600);
  }, []);

  const login = async (name, role) => {
    const s = { name, role };
    setSession(s);
    localStorage.setItem("wh-session", JSON.stringify(s));
  };
  
  const logout = async () => {
    setSession(null);
    localStorage.removeItem("wh-session");
  };

  const saveProductToFirebase = async (product) => {
    if (!firebaseReady || !db) {
      showToast("Firebase غير متصل - تم الحفظ محلياً فقط", "warn");
      return;
    }
    try {
      setSyncStatus("syncing");
      await db.collection("products").doc(product.id).set(product, { merge: true });
      setSyncStatus("synced");
    } catch (error) {
      console.error("Firebase save error:", error);
      setSyncStatus("error");
      showToast("خطأ في المزامنة مع Firebase", "warn");
    }
  };

  const locationIndex = useMemo(() => {
    const idx = {};
    for (const locCode of ALL_LOCATIONS) {
      idx[locCode] = [];
    }
    for (const p of products) {
      for (const l of p.locations) {
        if (!idx[l.code]) idx[l.code] = [];
        idx[l.code].push({ product: p, qty: l.qty });
      }
    }
    return idx;
  }, [products]);

  const stats = useMemo(() => {
    const totalProducts = products.length;
    const totalStock = products.reduce((s, p) => s + totalQty(p), 0);
    const lowStock = products.filter((p) => { const q = totalQty(p); return q > 0 && q <= LOW_STOCK_THRESHOLD; });
    const mostUsed = [...products].map((p) => ({ name: p.name, used: timesUsed(p) }))
      .sort((a, b) => b.used - a.used).slice(0, 6);
    return { totalProducts, totalStock, lowStock, mostUsed };
  }, [products]);

  const applyAdd = async (barcode, name, qty, location, worker) => {
    const ts = new Date().toISOString();
    const existingIdx = products.findIndex((p) => p.barcode === barcode);
    
    if (existingIdx >= 0) {
      const p = products[existingIdx];
      const locs = [...p.locations];
      const li = locs.findIndex((l) => l.code === location);
      
      if (li >= 0) {
        locs[li] = { ...locs[li], qty: locs[li].qty + qty };
      } else {
        locs.push({ code: location, qty });
      }
      
      const updatedProduct = {
        ...p,
        locations: locs,
        history: [{ id: `h_${Date.now()}`, action: "ADD", qty, worker, location, ts }, ...p.history],
        updatedAt: ts
      };
      
      await saveProductToFirebase(updatedProduct);
      showToast(`تمت إضافة +${qty} إلى ${p.name}`, "ok");
    } else {
      const newProduct = {
        name: name || "منتج غير مسمى",
        barcode,
        locations: [{ code: location, qty }],
        history: [{ id: `h_${Date.now()}`, action: "ADD", qty, worker, location, ts }],
        createdAt: ts,
        updatedAt: ts
      };
      
      const docRef = await db.collection("products").add(newProduct);
      showToast(`تم إنشاء منتج جديد "${newProduct.name}"`, "ok");
    }
  };

  const applyRemove = async (productId, location, qty, worker) => {
    const p = products.find((p) => p.id === productId);
    if (!p) return;
    
    const locs = [...p.locations];
    const li = locs.findIndex((l) => l.code === location);
    if (li < 0) return;
    
    const available = locs[li].qty;
    const removeQty = Math.min(qty, available);
    locs[li] = { ...locs[li], qty: available - removeQty };
    
    if (locs[li].qty === 0) {
      locs.splice(li, 1);
    }
    
    const updatedProduct = {
      ...p,
      locations: locs,
      history: [{ id: `h_${Date.now()}`, action: "REMOVE", qty: removeQty, worker, location, ts: new Date().toISOString() }, ...p.history],
      updatedAt: new Date().toISOString()
    };
    
    await saveProductToFirebase(updatedProduct);
    showToast(`تم سحب -${removeQty} من ${p.name}`, "warn");
  };

  const updateProductName = async (productId, newName) => {
    if (!newName.trim()) return;
    const p = products.find(p => p.id === productId);
    if (!p) return;
    
    const updatedProduct = {
      ...p,
      name: newName.trim(),
      history: [{ id: `h_${Date.now()}`, action: "RENAME_PRODUCT", qty: 0, worker: session.name, location: p.locations[0]?.code || "", oldName: p.name, newName: newName.trim(), ts: new Date().toISOString() }, ...p.history],
      updatedAt: new Date().toISOString()
    };
    
    await saveProductToFirebase(updatedProduct);
    showToast("تم تحديث اسم المنتج بنجاح", "ok");
  };

  const updateLocation = async (productId, oldCode, newCode) => {
    if (!newCode.trim() || newCode === oldCode) return;
    const p = products.find(p => p.id === productId);
    if (!p) return;
    
    const locIdx = p.locations.findIndex(l => l.code === oldCode);
    if (locIdx < 0) return;
    
    const newLocs = [{ ...p.locations[locIdx], code: newCode }];
    const updatedProduct = {
      ...p,
      locations: newLocs,
      history: [{ id: `h_${Date.now()}`, action: "MOVE_LOCATION", qty: newLocs[0].qty, worker: session.name, location: newCode, movedFrom: oldCode, ts: new Date().toISOString() }, ...p.history],
      updatedAt: new Date().toISOString()
    };
    
    await saveProductToFirebase(updatedProduct);
    setSelectedLoc(newCode);
    showToast("تم تحديث مكان الرف بنجاح", "ok");
  };

  const allHistory = useMemo(() =>
    products.flatMap((p) => p.history.map((h) => ({ ...h, productName: p.name, barcode: p.barcode })))
      .sort((a, b) => new Date(b.ts) - new Date(a.ts)), [products]);

  // دالة للبحث عن منتج وإظهار موقعه مع وميض 30 ثانية
  const handleSearch = useCallback((loc) => {
    // إلغاء الوميض السابق إن وجد
    if (glowTimeout) {
      clearTimeout(glowTimeout);
    }
    
    setView("map");
    setSearchHighlight(loc);
    setSelectedLoc(loc);
    
    // وميض لمدة 30 ثانية
    const timeout = setTimeout(() => {
      setSearchHighlight(null);
      setGlowTimeout(null);
    }, 30000);
    
    setGlowTimeout(timeout);
  }, [glowTimeout]);

  if (!ready) return <SplashLoader T={T} />;
  if (!session) return <LoginScreen T={T} onLogin={login} />;

  return (
    <div className="font-body" style={{ background: T.bg, color: T.text, minHeight: "100vh", width: "100%" }}>
      <TopBar T={T} dark={dark} setDark={setDark} session={session} onLogout={logout}
        view={view} setView={setView} onScan={() => setScannerOpen(true)}
        onSearch={handleSearch}
        products={products} syncStatus={syncStatus} />

      <main className="main-content" style={{ maxWidth: 1320, margin: "0 auto", padding: "20px 16px 80px" }}>
        {view === "map" && <WarehouseMap T={T} locationIndex={locationIndex} onSelect={setSelectedLoc} highlight={searchHighlight} />}
        {view === "dashboard" && <Dashboard T={T} stats={stats} products={products} />}
        {view === "history" && <HistoryPanel T={T} history={allHistory} />}
      </main>

      {selectedLoc && (
        <DetailPanel T={T} code={selectedLoc} entries={locationIndex[selectedLoc] || []} session={session}
          onClose={() => setSelectedLoc(null)}
          onRemove={(productId, qty, worker) => applyRemove(productId, selectedLoc, qty, worker)}
          onAdd={(barcode, name, qty, worker) => applyAdd(barcode, name, qty, selectedLoc, worker)}
          onUpdateProductName={updateProductName}
          onUpdateLocation={updateLocation}
          onScanBarcode={(callback) => { setScanCallback(() => callback); setScannerOpen(true); }} />
      )}

      {scannerOpen && <BarcodeScanner T={T} onClose={() => { setScannerOpen(false); setScanCallback(null); }} onDetected={(code) => { 
        setScannerOpen(false); 
        if (scanCallback) {
          scanCallback(code);
          setScanCallback(null);
        } else {
          setScanResult(code);
        }
      }} />}

      {scanResult && (
        <ScanResultPanel T={T} barcode={scanResult} products={products} session={session}
          onClose={() => setScanResult(null)}
          onConfirm={(name, qty, location, worker) => {
            applyAdd(scanResult, name, qty, location, worker);
            setScanResult(null);
            handleSearch(location);
          }} />
      )}

      {toast && <Toast T={T} toast={toast} />}
    </div>
  );
}

function statusColor(entries, T) {
  if (!entries || entries.length === 0) return T.gray;
  const totalQty = entries.reduce((sum, e) => sum + e.qty, 0);
  if (totalQty <= LOW_STOCK_THRESHOLD) return T.red;
  return T.green;
}

function WarehouseMap({ T, locationIndex, onSelect, highlight }) {
  const cellRefs = useRef({});
  useEffect(() => {
    if (highlight && cellRefs.current[highlight]) {
      cellRefs.current[highlight].scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });

function Legend({ T }) {

  return (

function ShelfBlock({ T, shelf, locationIndex, highlight, onSelect, cellRefs }) {
  const [hover, setHover] = useState(null);

  const renderColumns = (sideSuffix, sideLabel) => (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
      {sideLabel && <div style={{ fontSize: 9, color: T.muted, marginBottom: 4, fontWeight: 600 }}>{sideLabel}</div>}
      <div style={{ display: "flex", gap: 4 }}>
        {Array.from({ length: shelf.columns }, (_, ci) => {
          const col = ci + 1;
          return (
            <div key={col} style={{ display: "flex", flexDirection: "column-reverse", gap: 4 }}>
              {Array.from({ length: LEVELS }, (_, li) => {
                const level = li + 1;
                const code = `${shelf.id}${sideSuffix}${col}-${level}`;
                const entries = locationIndex[code] || [];
                const color = statusColor(entries, T);
                const isHighlight = highlight === code;
                const isHover = hover === code;
                const totalQty = entries.reduce((sum, e) => sum + e.qty, 0);
                return (
                  <div key={code} ref={(el) => (cellRefs.current[code] = el)}
                    onClick={() => onSelect(code)} onMouseEnter={() => setHover(code)} onMouseLeave={() => setHover(null)}
                    className={isHighlight ? "glow-long" : ""}
                    title={entries.length > 0 ? `${entries.map(e => e.product.name).join(", ")} · ${totalQty}` : "فارغ"}
                    style={{
                      width: 36, height: 20, borderRadius: 4, cursor: "pointer",
                      background: color, opacity: entries.length === 0 ? 0.35 : 1,
                      border: isHighlight ? `2px solid ${T.goldBright}` : `1px solid ${T.bg}55`,
                      transform: isHover ? "translateY(-2px) scale(1.05)" : "none",
                      transition: "transform .15s ease, opacity .15s ease", position: "relative",
                    }}>
                    {entries.length > 1 && (
                      <div style={{ position: "absolute", top: -2, right: -2, width: 8, height: 8, background: T.goldBright, borderRadius: "50%", border: `1px solid ${T.bg}` }} />
                    )}
                    {isHover && (
                      <div style={{ position: "absolute", bottom: "115%", left: "50%", transform: "translateX(-50%)",
                        background: T.surface, border: `1px solid ${T.border}`, borderRadius: 6, padding: "6px 8px",
                        whiteSpace: "nowrap", zIndex: 50, fontSize: 11, boxShadow: "0 6px 18px rgba(0,0,0,.35)" }}>
                        <div className="font-mono" style={{ color: T.gold, fontWeight: 700 }}>{code}</div>
                        {entries.length === 0 ? (
                          <div style={{ color: T.text }}>مكان فارغ</div>
                        ) : (
                          <>
                            {entries.map((e, i) => (
                              <div key={i} style={{ color: T.text, borderBottom: i < entries.length - 1 ? `1px solid ${T.border}` : "none", paddingBottom: i < entries.length - 1 ? 4 : 0, marginBottom: i < entries.length - 1 ? 4 : 0 }}>
                                {e.product.name} ({e.qty})
                              </div>
                            ))}
                          </>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
              <div className="font-mono" style={{ fontSize: 9, color: T.muted, textAlign: "center" }}>{col}</div>
            </div>
          );
        })}
      </div>
    </div>
  );

  return (
    <div className="shelf-block" style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
      <div style={{
        fontWeight: 800, fontSize: 22, color: T.gold, marginBottom: 8, fontFamily: "'Space Grotesk', sans-serif",
        width: 32, height: 32, borderRadius: 8, background: "rgba(227,165,72,0.12)", border: `1px solid ${T.gold}55`,
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>{shelf.id}</div>

      <div style={{ display: "flex", gap: 12, position: "relative" }}>
        {shelf.sides === 2 ? (
          <>
            {renderColumns("أ", "أمامي")}
            <div style={{ width: 1, background: T.border, margin: "0 4px" }}></div>
            {renderColumns("خ", "خلفي")}
          </>
        ) : (
          renderColumns("", null)
        )}
      </div>
    </div>
  );
}

    if (entries.length > 0 && entries[selectedProductIdx]) {

      return;
    }
    onAdd(newBarcode.trim(), newName.trim(), newQty, newWorker.trim());
    setNewName("");
    setNewBarcode("");
    setNewQty(1);
    setShowAddNew(false);
  };

  const handleScanBarcode = () => {
    onScanBarcode((code) => {
      setNewBarcode(code);
      showToast(`تم قراءة الباركود: ${code}`, "ok");

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 60, display: "flex", justifyContent: "flex-end" }}>

/* =========================================================================
   BARCODE SCANNER
   ========================================================================= */
function BarcodeScanner({ T, onClose, onDetected }) {
  const videoRef = useRef(null);
  const [error, setError] = useState(null);
  const [manual, setManual] = useState("");
  const [supported, setSupported] = useState(true);

  useEffect(() => {
    let stream, raf, detector, stopped = false;
    async function start() {
      if (!("BarcodeDetector" in window)) { setSupported(false); return; }
      try {
        detector = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "qr_code"] });
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (stopped) { stream.getTracks().forEach((t) => t.stop()); return; }
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
        const loop = async () => {
          if (stopped) return;
          try {
            const codes = await detector.detect(videoRef.current);
            if (codes.length > 0) { onDetected(codes[0].rawValue); return; }
          } catch {}
          raf = requestAnimationFrame(loop);
        };
        loop();
      } catch (e) { setError("تم رفض الوصول للكاميرا أو أنها غير متاحة."); }
    }
    start();
    return () => { stopped = true; if (raf) cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach((t) => t.stop()); };
  }, [onDetected]);

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 70, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div className="fade-up" style={{ background: T.surface, borderRadius: 16, padding: 20, width: 380, maxWidth: "100%" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontWeight: 700, display: "flex", alignItems: "center", gap: 7 }}><Icon name="scan" size={16} color={T.gold} /> مسح الباركود</div>
          <button onClick={onClose} style={{ background: "transparent", border: "none", color: T.muted, cursor: "pointer" }}><Icon name="x" size={18} /></button>
        </div>

        {supported ? (
          <div style={{ position: "relative", borderRadius: 12, overflow: "hidden", background: "#000", aspectRatio: "4/3" }}>
            <video ref={videoRef} muted playsInline style={{ width: "100%", height: "100%", objectFit: "cover" }} />
            <div style={{ position: "absolute", inset: "20%", border: `2px solid ${T.gold}`, borderRadius: 10 }} />
          </div>
        ) : (
          <div style={{ fontSize: 12.5, color: T.muted, marginBottom: 10 }}>المسح المباشر غير مدعوم في هذا المتصفح. أدخل الباركود يدوياً أدناه.</div>
        )}
        {error && <div style={{ fontSize: 12, color: T.red, marginTop: 8 }}>{error}</div>}

        <div style={{ marginTop: 14 }}>
          <FieldLabel T={T}>أو أدخل يدوياً</FieldLabel>
          <div style={{ display: "flex", gap: 8 }}>
            <TextInput T={T} value={manual} onChange={setManual} placeholder="مثال: 8400000012345" mono />
            <button disabled={!manual.trim()} onClick={() => onDetected(manual.trim())}
              style={{ padding: "0 16px", borderRadius: 9, border: "none", background: manual.trim() ? T.gold : T.gray, color: "#14181F", fontWeight: 700, cursor: manual.trim() ? "pointer" : "not-allowed" }}>
              <Icon name="check" size={15} />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

              background: (h.action === "ADD" || h.action === "MOVE_ADD") ? "rgba(62,207,142,0.15)" : "rgba(240,85,95,0.15)",
              color: (h.action === "ADD" || h.action === "MOVE_ADD") ? T.green : T.red,
            }}><Icon name={(h.action === "ADD" || h.action === "MOVE_ADD") ? "plus" : "minus"} size={15} /></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{h.productName}</div>
              <div style={{ fontSize: 11.5, color: T.muted, display: "flex", gap: 8, alignItems: "center" }}>
                <Icon name="user" size={11} /> {h.worker} <span className="font-mono">· {h.location}</span>
              </div>
            </div>
            <div style={{ textAlign: "left" }}>
              <div style={{ fontWeight: 700, fontSize: 13, color: (h.action === "ADD" || h.action === "MOVE_ADD") ? T.green : T.red }}>
                {(h.action === "ADD" || h.action === "MOVE_ADD") ? "+" : "-"}{h.qty}
              </div>
              <div style={{ fontSize: 10.5, color: T.muted, display: "flex", alignItems: "center", gap: 3, justifyContent: "flex-end" }}><Icon name="clock" size={10} /> {new Date(h.ts).toLocaleString('ar-EG')}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* =========================================================================
   TOAST
   ========================================================================= */
function Toast({ T, toast }) {
  return (
    <div className="fade-up" style={{
      position: "fixed", bottom: 22, left: "50%", transform: "translateX(-50%)", zIndex: 80,
      background: T.surface, border: `1px solid ${toast.kind === "warn" ? T.red : T.green}`, borderRadius: 12,
      padding: "10px 18px", fontSize: 13, fontWeight: 600, color: T.text, boxShadow: "0 10px 30px rgba(0,0,0,.35)",
    }}>{toast.msg}</div>
  );
}

/* =========================================================================
   MOUNT
   ========================================================================= */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<WarehouseApp />);
</script>
</body>
</html>
