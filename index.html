// ===== Error Boundary لمنع الشاشة البيضاء =====
class ErrorBoundary extends Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("خطأ في التطبيق:", error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: 40, textAlign: "center", background: "#0A0C10", color: "#ECEEF1", minHeight: "100vh" }}>
          <h2 style={{ color: "#F0555F" }}>حدث خطأ</h2>
          <p>{this.state.error?.message}</p>
          <button onClick={() => window.location.reload()} style={{ padding: "10px 20px", background: "#E3A548", color: "#14181F", border: "none", borderRadius: 8, cursor: "pointer", fontWeight: 700 }}>إعادة التحميل</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const SHELVES = [
  { id: "F", columns: 5, sides: 1 },
  { id: "A", columns: 6, sides: 1 },
  { id: "B", columns: 4, sides: 2 },
  { id: "C", columns: 4, sides: 2 },
  { id: "D", columns: 3, sides: 2 },
  { id: "E", columns: 5, sides: 1 },
  { id: "G", columns: 5, sides: 1 },
];
const LEVELS = 5;
const LOW_STOCK_THRESHOLD = 6;

const ALL_LOCATIONS = SHELVES.flatMap((s) => {
  if (s.sides === 2) {
    const front = Array.from({ length: s.columns }, (_, c) =>
      Array.from({ length: LEVELS }, (_, l) => `${s.id}أ${c + 1}-${l + 1}`)
    ).flat();
    const back = Array.from({ length: s.columns }, (_, c) =>
      Array.from({ length: LEVELS }, (_, l) => `${s.id}خ${c + 1}-${l + 1}`)
    ).flat();
    return [...front, ...back];
  }
  return Array.from({ length: s.columns }, (_, c) =>
    Array.from({ length: LEVELS }, (_, l) => `${s.id}${c + 1}-${l + 1}`)
  ).flat();
});

const totalQty = (p) => (p.locations || []).reduce((s, l) => s + (l.qty || 0), 0);
const timesUsed = (p) => (p.history || []).reduce((s, h) => s + (h.action === "REMOVE" ? h.qty : 0), 0);

const THEMES = {
  dark: {
    bg: "#0A0C10", surface: "#14181F", surface2: "#1B2029", border: "#262C36",
    text: "#ECEEF1", muted: "#8B92A0", gold: "#E3A548", goldBright: "#F4C874",
    green: "#3ECF8E", red: "#F0555F", gray: "#454C57", floor: "#111722",
  }
};

function WarehouseApp() {
  const [ready, setReady] = useState(false);
  const [session, setSession] = useState({ name: "Mouh", role: "عامل" });
  const [dark, setDark] = useState(true);
  const [products, setProducts] = useState([]);
  const [view, setView] = useState("map");
  const [selectedLoc, setSelectedLoc] = useState(null);
  const [searchHighlight, setSearchHighlight] = useState(null);
  const [scannerOpen, setScannerOpen] = useState(false);
  const [scanResult, setScanResult] = useState(null);
  const [toast, setToast] = useState(null);
  const [syncStatus, setSyncStatus] = useState("idle");
  const [showNotifications, setShowNotifications] = useState(false);
  const [showNewProductModal, setShowNewProductModal] = useState(false);
  const glowTimeoutRef = useRef(null);
  const T = THEMES.dark;

  useEffect(() => {
    let unsubscribe;
    (async () => {
      try {
        if (firebaseReady && db) {
          unsubscribe = db.collection("products").onSnapshot((snapshot) => {
            const productsData = [];
            snapshot.forEach((doc) => {
              productsData.push({ id: doc.id, ...doc.data() });
            });
            setProducts(productsData);
            setSyncStatus("synced");
          }, (error) => {
            console.error("Firebase error:", error);
            setSyncStatus("error");
          });
        }
        setReady(true);
      } catch (err) {
        console.error("Init error:", err);
        setReady(true);
      }
    })();
    return () => { if (unsubscribe) unsubscribe(); };
  }, []);

  const showToast = useCallback((msg, kind = "ok") => {
    setToast({ msg, kind, id: Date.now() });
    setTimeout(() => setToast((t) => (t && t.msg === msg ? null : t)), 4000);
  }, []);

  // ✅ التنظيف: يحذف فقط المنتجات "بدون موقع" (البيانات التالفة)
  useEffect(() => {
    if (!ready || !firebaseReady || !db) return;
    const noLocationProducts = products.filter(p => !p.locations || p.locations.length === 0);
    if (noLocationProducts.length === 0) return;
    noLocationProducts.forEach(async (p) => {
      try {
        await db.collection("products").doc(p.id).delete();
        showToast(`🗑️ تم حذف "${p.name}" نهائياً (لا يحتوي على موقع)`, "warn");
      } catch (err) {
        console.error("Cleanup error:", err);
      }
    });
  }, [ready, products, showToast]);

  useEffect(() => {
    if (!ready || products.length === 0) return;
    const checkLowStock = () => {
      const lowStockItems = products.filter(p => {
        const qty = totalQty(p);
        return qty > 0 && qty <= LOW_STOCK_THRESHOLD;
      });
      if (lowStockItems.length > 0) {
        setToast({
          msg: `⚠️ ${lowStockItems.length} منتجات على وشك النفاذ`,
          kind: "warn",
          id: Date.now()
        });
      }
    };
    checkLowStock();
    const interval = setInterval(checkLowStock, 86400000);
    return () => clearInterval(interval);
  }, [ready, products]);

  const saveProductToFirebase = async (product) => {
    if (!firebaseReady || !db) return;
    try {
      setSyncStatus("syncing");
      await db.collection("products").doc(product.id).set(product, { merge: true });
      setSyncStatus("synced");
    } catch (error) {
      console.error("Save error:", error);
      setSyncStatus("error");
    }
  };

  const locationIndex = useMemo(() => {
    const idx = {};
    for (const locCode of ALL_LOCATIONS) idx[locCode] = [];
    for (const p of products) {
      if (!p.locations) continue;
      for (const l of p.locations) {
        if (!idx[l.code]) idx[l.code] = [];
        idx[l.code].push({ product: p, qty: l.qty });
      }
    }
    return idx;
  }, [products]);

  // ✅ محمي: لا يسمح بإضافة منتج بدون موقع
  const applyAdd = async (barcode, name, qty, location, worker) => {
    if (!location || !location.trim()) {
      showToast("⚠️ خطأ: يجب تحديد موقع للمنتج", "warn");
      return;
    }
    if (!barcode || !barcode.trim()) {
      showToast("⚠️ خطأ: يجب إدخال الباركود", "warn");
      return;
    }
    if (!name || !name.trim()) {
      showToast("⚠️ خطأ: يجب إدخال اسم المنتج", "warn");
      return;
    }
    
    const ts = new Date().toISOString();
    const existingIdx = products.findIndex((p) => p.barcode === barcode);
    if (existingIdx >= 0) {
      const p = products[existingIdx];
      const locs = [...(p.locations || [])];
      const li = locs.findIndex((l) => l.code === location);
      if (li >= 0) locs[li] = { ...locs[li], qty: (locs[li].qty || 0) + qty };
      else locs.push({ code: location, qty });
      const updated = { 
        ...p, 
        locations: locs, 
        history: [{ id: `h_${Date.now()}`, action: "ADD", qty, worker, location, ts }, ...(p.history || [])] 
      };
      await saveProductToFirebase(updated);
      showToast(`+${qty} ${p.name}`, "ok");
    } else {
      const newProduct = { 
        name, barcode, locations: [{ code: location, qty }], 
        history: [{ id: `h_${Date.now()}`, action: "ADD", qty, worker, location, ts }], 
        createdAt: ts 
      };
      await db.collection("products").add(newProduct);
      showToast(`✅ منتج جديد: ${name}`, "ok");
    }
  };

  // ✅ عند السحب يُبقي الموقع بكمية 0 — المنتج يبقى محفوظاً بموقعه ويظهر بالأحمر
  const applyRemove = async (productId, location, qty, worker) => {
    const p = products.find((p) => p.id === productId);
    if (!p) return;
    const locs = [...(p.locations || [])];
    const li = locs.findIndex((l) => l.code === location);
    if (li < 0) return;
    const removeQty = Math.min(qty, locs[li].qty);
    locs[li] = { ...locs[li], qty: locs[li].qty - removeQty };

    const updated = { 
      ...p, locations: locs, 
      history: [{ id: `h_${Date.now()}`, action: "REMOVE", qty: removeQty, worker, location, ts: new Date().toISOString() }, ...(p.history || [])] 
    };
    await saveProductToFirebase(updated);
    showToast(`-${removeQty} من ${p.name}`, "warn");
  };

  // ✅ جديد: حذف المنتج من موقع معين (لإصلاح خطأ وضع المنتج في مكان خاطئ)
  const applyDeleteFromLocation = async (productId, location, worker) => {
    const p = products.find((p) => p.id === productId);
    if (!p) return;
    const locs = [...(p.locations || [])];
    const li = locs.findIndex((l) => l.code === location);
    if (li < 0) return;
    const removedQty = locs[li].qty || 0;
    locs.splice(li, 1);

    if (locs.length === 0) {
      // لا يوجد موقع آخر → حذف المنتج نهائياً حتى لا يبقى منتج بدون موقع
      try {
        setSyncStatus("syncing");
        await db.collection("products").doc(productId).delete();
        setSyncStatus("synced");
        showToast(`🗑️ تم حذف ${p.name} نهائياً (لا يوجد موقع آخر)`, "warn");
      } catch (error) {
        console.error("Delete error:", error);
        setSyncStatus("error");
      }
      return;
    }

    const updated = {
      ...p,
      locations: locs,
      history: [{ id: `h_${Date.now()}`, action: "REMOVE", qty: removedQty, worker: worker || session.name, location, ts: new Date().toISOString() }, ...(p.history || [])]
    };
    await saveProductToFirebase(updated);
    showToast(`🗑️ تم حذف ${p.name} من ${location}`, "warn");
  };

  const applyRename = async (productId, newName) => {
    const p = products.find((p) => p.id === productId);
    if (!p) return;
    const trimmed = newName.trim();
    if (!trimmed) return;
    const updated = { ...p, name: trimmed };
    await saveProductToFirebase(updated);
    showToast(`✏️ تم تعديل الاسم إلى: ${trimmed}`, "ok");
  };

  const handleSearch = useCallback((loc, productName) => {
    if (glowTimeoutRef.current) clearTimeout(glowTimeoutRef.current);
    setView("map");
    setSearchHighlight(loc);
    setSelectedLoc(loc);
    showToast(`📍 ${productName || 'المنتج'} - ${loc}`, "ok");
    glowTimeoutRef.current = setTimeout(() => {
      setSearchHighlight(null);
    }, 60000);
  }, [showToast]);

  const lowStockProducts = useMemo(() => {
    return products.filter(p => {
      const qty = totalQty(p);
      return qty > 0 && qty <= LOW_STOCK_THRESHOLD;
    }).map(p => ({
      name: p.name,
      qty: totalQty(p),
      location: (p.locations && p.locations[0]) ? p.locations[0].code : "N/A",
      barcode: p.barcode
    }));
  }, [products]);

  if (!ready) return <div style={{ background: T.bg, color: T.text, height: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}><Icon name="boxes" size={34} color={T.gold} /><div style={{ marginRight: 10 }}>جاري التحميل...</div></div>;

  return (
    <div style={{ background: T.bg, color: T.text, minHeight: "100vh" }}>
      <TopBar 
        T={T} 
        dark={dark} 
        setDark={setDark} 
        session={session} 
        view={view} 
        setView={setView} 
        onScan={() => setScannerOpen(true)} 
        onSearch={handleSearch} 
        products={products} 
        syncStatus={syncStatus}
        lowStockCount={lowStockProducts.length}
        onShowNotifications={() => setShowNotifications(true)}
        onNewProduct={() => setShowNewProductModal(true)}
      />
      
      {showNotifications && (
        <NotificationsPanel 
          T={T} 
          products={lowStockProducts} 
          onClose={() => setShowNotifications(false)} 
        />
      )}
      
      <main style={{ maxWidth: 1320, margin: "0 auto", padding: "20px 16px 80px" }}>
        {view === "map" && <WarehouseMap T={T} locationIndex={locationIndex} onSelect={(loc, name) => handleSearch(loc, name)} highlight={searchHighlight} />}
        {view === "dashboard" && <Dashboard T={T} products={products} lowStock={lowStockProducts} />}
        {view === "history" && <HistoryPanel T={T} history={products.flatMap(p => (p.history || []).map(h => ({ ...h, productName: p.name }))).sort((a, b) => new Date(b.ts) - new Date(a.ts))} />}
      </main>
      
      {selectedLoc && <DetailPanel T={T} code={selectedLoc} entries={locationIndex[selectedLoc] || []} session={session} onClose={() => setSelectedLoc(null)} onRemove={applyRemove} onAdd={applyAdd} onRename={applyRename} onScanBarcode={() => setScannerOpen(true)} onDeleteFromLocation={applyDeleteFromLocation} />}
      {scannerOpen && <BarcodeScanner T={T} session={session} onClose={() => setScannerOpen(false)} onDetected={(code) => { setScannerOpen(false); setScanResult(code); }} products={products} />}
      {scanResult && <ScanWithdrawalPanel T={T} barcode={scanResult} products={products} session={session} onClose={() => setScanResult(null)} onConfirm={async (productId, location, qty, worker) => { await applyRemove(productId, location, qty, worker); setScanResult(null); }} />}
      {showNewProductModal && (
        <NewProductModal 
          T={T} 
          session={session} 
          products={products}
          allLocations={ALL_LOCATIONS}
          locationIndex={locationIndex}
          onClose={() => setShowNewProductModal(false)} 
          onConfirm={async (barcode, name, qty, location, worker) => {
            await applyAdd(barcode, name, qty, location, worker);
            setShowNewProductModal(false);
          }}
          onScanBarcode={() => setScannerOpen(true)}
        />
      )}
      {toast && <Toast T={T} toast={toast} />}
    </div>
  );
}

function TopBar({ T, dark, setDark, session, view, setView, onScan, onSearch, products, syncStatus, lowStockCount, onShowNotifications, onNewProduct }) {
  const [q, setQ] = useState("");
  const [results, setResults] = useState([]);
  
  useEffect(() => {
    if (!q.trim()) { setResults([]); return; }
    const ql = q.toLowerCase();
    setResults(products.filter(p => 
      (p.name && p.name.toLowerCase().includes(ql)) || 
      (p.barcode && p.barcode.includes(q))
    ).slice(0, 6));
  }, [q, products]);
  
  return (
    <div className="top-bar" style={{ position: "sticky", top: 0, zIndex: 30, background: T.bg + "F2", backdropFilter: "blur(10px)", borderBottom: `1px solid ${T.border}` }}>
      <div style={{ maxWidth: 1320, margin: "0 auto", padding: "12px 16px", display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <TourExpertLogo size={40} />
          <div className="font-display" style={{ fontWeight: 700, fontSize: 18 }}>Stock Tour Expert</div>
        </div>
        
        <nav className="nav-buttons" style={{ display: "flex", gap: 2 }}>
          {[["map", "الخريطة"], ["dashboard", "لوحة التحكم"], ["history", "السجل"]].map(([id, label]) => (
            <button key={id} onClick={() => setView(id)} style={{ padding: "8px 12px", borderRadius: 9, border: "none", background: view === id ? T.surface2 : "transparent", color: view === id ? T.gold : T.muted, cursor: "pointer", fontWeight: 600 }}>{label}</button>
          ))}
        </nav>
        
        <div className="search-container" style={{ position: "relative", flex: "1 1 220px", minWidth: 180 }}>
          <Icon name="search" size={14} color={T.muted} style={{ position: "absolute", right: 10, top: 10 }} />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="ابحث بالاسم أو الباركود..." style={{ width: "100%", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 9, padding: "8px 30px 8px 10px", color: T.text, outline: "none" }} />
          {results.length > 0 && (
            <div style={{ position: "absolute", top: 38, right: 0, left: 0, background: T.surface, border: `1px solid ${T.border}`, borderRadius: 10, overflow: "hidden", zIndex: 40, maxHeight: 350, overflowY: "auto" }}>
              {results.map(p => {
                const safeLocations = Array.isArray(p.locations) ? [...p.locations] : [];
                const loc = safeLocations.length > 0 
                  ? safeLocations.sort((a, b) => (b.qty || 0) - (a.qty || 0))[0] 
                  : null;
                
                if (!loc) return null;
                
                return (
                  <button key={p.id} onClick={() => { onSearch(loc.code, p.name); setQ(""); setResults([]); }} style={{ display: "flex", justifyContent: "space-between", width: "100%", padding: "14px 12px", background: "transparent", border: "none", borderBottom: `1px solid ${T.border}`, cursor: "pointer", textAlign: "right" }} className="slide-in">
                    <div style={{ textAlign: "right" }}>
                      <div className="font-mono" style={{ color: T.gold, fontWeight: 700, fontSize: 16 }}>{loc.code}</div>
                      <div style={{ fontSize: 12, color: totalQty(p) === 0 ? T.red : T.muted, marginTop: 2 }}>{totalQty(p)} وحدة</div>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 700, fontSize: 16, color: T.goldBright, marginBottom: 2 }}>{p.name}</div>
                      <div className="font-mono" style={{ fontSize: 12, color: T.muted }}>{p.barcode}</div>
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
        
        <button 
          onClick={onNewProduct} 
          style={{ 
            padding: "9px 16px", 
            borderRadius: 9, 
            border: "none", 
            background: "linear-gradient(135deg, #3ECF8E 0%, #2BA36F 100%)", 
            color: "#14181F", 
            cursor: "pointer", 
            display: "flex", 
            alignItems: "center", 
            gap: 6,
            fontWeight: 700,
            fontSize: 13,
            boxShadow: "0 4px 12px rgba(62,207,142,0.25)",
            transition: "transform 0.15s"
          }}
          onMouseEnter={(e) => e.currentTarget.style.transform = "translateY(-1px)"}
          onMouseLeave={(e) => e.currentTarget.style.transform = "translateY(0)"}
        >
          <Icon name="plus" size={16} color="#14181F" />
          منتج جديد
        </button>
        
        <button onClick={onScan} style={{ padding: "8px 12px", borderRadius: 9, border: `1px solid ${T.gold}`, background: "rgba(227,165,72,0.1)", color: T.gold, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}><Icon name="camera" size={14} /> مسح</button>
        
        {lowStockCount > 0 && (
          <button onClick={onShowNotifications} style={{ position: "relative", padding: "8px 12px", borderRadius: 9, border: `1px solid ${T.red}`, background: "rgba(240,85,95,0.1)", color: T.red, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
            <Icon name="bell" size={14} />
            <span style={{ fontWeight: 700 }}>{lowStockCount}</span>
          </button>
        )}
        
        <button onClick={() => setDark(!dark)} style={{ background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 9, width: 34, height: 34, cursor: "pointer", color: T.muted }}><Icon name={dark ? "sun" : "moon"} size={15} /></button>
        
        <div style={{ display: "flex", alignItems: "center", gap: 8, paddingRight: 8, borderRight: `1px solid ${T.border}` }}>
          <div style={{ textAlign: "left" }}>
            <div style={{ fontSize: 12.5, fontWeight: 600 }}>{session.name}</div>
            <div style={{ fontSize: 10.5, color: T.muted }}>{session.role}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function NewProductModal({ T, session, products, allLocations, locationIndex, onClose, onConfirm, onScanBarcode }) {
  const [name, setName] = useState("");
  const [barcode, setBarcode] = useState("");
  const [qty, setQty] = useState(1);
  const [location, setLocation] = useState("");
  const [worker, setWorker] = useState(session.name);
  const [error, setError] = useState("");
  
  const existingProduct = products.find(p => p.barcode === barcode && barcode.trim() !== "");
  const existingInLocation = location && locationIndex[location] && locationIndex[location].length > 0;
  
  const emptyLocations = allLocations.filter(loc => !locationIndex[loc] || locationIndex[loc].length === 0);
  const occupiedLocations = allLocations.filter(loc => locationIndex[loc] && locationIndex[loc].length > 0);
  
  const handleSubmit = () => {
    setError("");
    
    if (!name.trim()) { setError("⚠️ الرجاء إدخال اسم المنتج"); return; }
    if (!barcode.trim()) { setError("⚠️ الرجاء إدخال الباركود"); return; }
    if (!location) { setError("⚠️ الرجاء اختيار الموقع"); return; }
    if (qty < 1) { setError("⚠️ الكمية يجب أن تكون 1 على الأقل"); return; }
    
    onConfirm(barcode.trim(), name.trim(), Number(qty), location, worker.trim() || session.name);
  };
  
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(0,0,0,0.75)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={onClose}>
      <div 
        className="fade-up slide-in" 
        style={{ 
          background: T.surface, 
          borderRadius: 18, 
          padding: 28, 
          width: "100%", 
          maxWidth: 520, 
          maxHeight: "90vh", 
          overflowY: "auto",
          boxShadow: "0 25px 60px rgba(0,0,0,0.5)"
        }} 
        onClick={e => e.stopPropagation()}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 22 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ 
              width: 42, 
              height: 42, 
              borderRadius: 12, 
              background: "linear-gradient(135deg, #3ECF8E 0%, #2BA36F 100%)", 
              display: "flex", 
              alignItems: "center", 
              justifyContent: "center",
              boxShadow: "0 4px 14px rgba(62,207,142,0.3)"
            }}>
              <Icon name="package" size={22} color="#14181F" />
            </div>
            <div>
              <div className="font-display" style={{ fontSize: 20, fontWeight: 700 }}>إضافة منتج جديد</div>
              <div style={{ fontSize: 12, color: T.muted }}>سجّل منتج جديد في المخزون</div>
            </div>
          </div>
          <button onClick={onClose} style={{ background: "transparent", border: "none", color: T.muted, cursor: "pointer", padding: 6, borderRadius: 6 }}><Icon name="x" size={20} /></button>
        </div>
        
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 18 }}>
          <div style={{ background: T.surface2, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
            <div style={{ fontSize: 10.5, color: T.muted, marginBottom: 2 }}>المواقع المتاحة</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: T.gold }}>{allLocations.length}</div>
          </div>
          <div style={{ background: T.surface2, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
            <div style={{ fontSize: 10.5, color: T.muted, marginBottom: 2 }}>فارغة</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: T.green }}>{emptyLocations.length}</div>
          </div>
          <div style={{ background: T.surface2, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
            <div style={{ fontSize: 10.5, color: T.muted, marginBottom: 2 }}>مشغولة</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: T.goldBright }}>{occupiedLocations.length}</div>
          </div>
        </div>
        
        {existingProduct && (
          <div style={{ 
            background: "rgba(240,85,95,0.1)", 
            border: `1px solid ${T.red}`, 
            borderRadius: 10, 
            padding: 12, 
            marginBottom: 14,
            display: "flex",
            gap: 10,
            alignItems: "flex-start"
          }}>
            <Icon name="alert" size={18} color={T.red} style={{ flexShrink: 0, marginTop: 2 }} />
            <div style={{ flex: 1, fontSize: 12.5 }}>
              <div style={{ fontWeight: 700, color: T.red, marginBottom: 3 }}>الباركود موجود مسبقاً</div>
              <div style={{ color: T.muted }}>
                المنتج <strong style={{ color: T.text }}>{existingProduct.name}</strong> موجود. سيتم إضافة الكمية الجديدة إلى نفس المنتج.
              </div>
            </div>
          </div>
        )}
        
        {error && (
          <div style={{ 
            background: "rgba(240,85,95,0.1)", 
            border: `1px solid ${T.red}`, 
            borderRadius: 10, 
            padding: "10px 14px", 
            marginBottom: 14,
            fontSize: 13,
            color: T.red,
            fontWeight: 600
          }}>
            {error}
          </div>
        )}
        
        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontSize: 12.5, color: T.muted, marginBottom: 6, fontWeight: 600 }}>
            اسم المنتج <span style={{ color: T.red }}>*</span>
          </label>
          <input 
            value={name} 
            onChange={e => setName(e.target.value)} 
            placeholder="مثال: مفك براغي 10مم" 
            autoFocus
            style={{ 
              width: "100%", 
              background: T.surface2, 
              border: `1px solid ${T.border}`, 
              borderRadius: 10, 
              padding: "11px 14px", 
              color: T.text,
              fontSize: 14,
              fontWeight: 500,
              outline: "none"
            }} 
          />
        </div>
        
        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontSize: 12.5, color: T.muted, marginBottom: 6, fontWeight: 600 }}>
            الباركود <span style={{ color: T.red }}>*</span>
          </label>
          <div style={{ display: "flex", gap: 8 }}>
            <input 
              value={barcode} 
              onChange={e => setBarcode(e.target.value)} 
              placeholder="أدخل الباركود" 
              className="font-mono"
              style={{ 
                flex: 1, 
                background: T.surface2, 
                border: `1px solid ${T.border}`, 
                borderRadius: 10, 
                padding: "11px 14px", 
                color: T.text,
                fontSize: 14,
                outline: "none"
              }} 
            />
            <button 
              onClick={onScanBarcode} 
              style={{ 
                padding: "11px 16px", 
                borderRadius: 10, 
                border: `1px solid ${T.gold}`, 
                background: "rgba(227,165,72,0.12)", 
                color: T.gold, 
                cursor: "pointer",
                display: "flex",
                alignItems: "center",
                gap: 6,
                fontWeight: 600
              }}
            >
              <Icon name="scan" size={16} />
            </button>
          </div>
        </div>
        
        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontSize: 12.5, color: T.muted, marginBottom: 6, fontWeight: 600 }}>
            موقع التخزين <span style={{ color: T.red }}>*</span>
          </label>
          <select 
            value={location} 
            onChange={e => setLocation(e.target.value)} 
            style={{ 
              width: "100%",
              background: T.surface2, 
              border: `1px solid ${T.border}`, 
              borderRadius: 10, 
              padding: "11px 14px", 
              color: T.text,
              fontSize: 14,
              outline: "none",
              fontFamily: "'IBM Plex Mono', monospace"
            }}
          >
            <option value="">-- اختر الموقع --</option>
            <optgroup label="🟢 المواقع الفارغة (موصى به)">
              {emptyLocations.map(loc => (
                <option key={loc} value={loc}>{loc}</option>
              ))}
            </optgroup>
            <optgroup label="🔵 المواقع المشغولة">
              {occupiedLocations.map(loc => (
                <option key={loc} value={loc}>{loc}</option>
              ))}
            </optgroup>
          </select>
          {location && existingInLocation && (
            <div style={{ marginTop: 6, fontSize: 11.5, color: T.gold, display: "flex", alignItems: "center", gap: 4 }}>
              <Icon name="alert" size={12} />
              <span>هذا الموقع مشغول حالياً بـ: {locationIndex[location].map(e => e.product.name).join(", ")}</span>
            </div>
          )}
        </div>
        
        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontSize: 12.5, color: T.muted, marginBottom: 6, fontWeight: 600 }}>
            الكمية <span style={{ color: T.red }}>*</span>
          </label>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button 
              onClick={() => setQty(Math.max(1, qty - 1))} 
              style={{ 
                width: 38, 
                height: 38, 
                borderRadius: 9, 
                border: `1px solid ${T.border}`, 
                background: T.surface2, 
                color: T.text, 
                cursor: "pointer",
                fontSize: 18,
                fontWeight: 700
              }}
            >−</button>
            <input 
              type="number" 
              value={qty} 
              onChange={e => setQty(Math.max(1, Number(e.target.value)))} 
              min="1" 
              style={{ 
                flex: 1, 
                textAlign: "center", 
                background: T.surface2, 
                border: `1px solid ${T.border}`, 
                borderRadius: 9, 
                padding: "9px 8px", 
                color: T.text,
                fontSize: 16,
                fontWeight: 600,
                outline: "none"
              }} 
            />
            <button 
              onClick={() => setQty(qty + 1)} 
              style={{ 
                width: 38, 
                height: 38, 
                borderRadius: 9, 
                border: `1px solid ${T.border}`, 
                background: T.surface2, 
                color: T.text, 
                cursor: "pointer",
                fontSize: 18,
                fontWeight: 700
              }}
            >+</button>
          </div>
        </div>
        
        <div style={{ marginBottom: 20 }}>
          <label style={{ display: "block", fontSize: 12.5, color: T.muted, marginBottom: 6, fontWeight: 600 }}>
            اسم العامل
          </label>
          <input 
            value={worker} 
            onChange={e => setWorker(e.target.value)} 
            placeholder="اسم العامل"
            style={{ 
              width: "100%", 
              background: T.surface2, 
              border: `1px solid ${T.border}`, 
              borderRadius: 10, 
              padding: "11px 14px", 
              color: T.text,
              fontSize: 14,
              outline: "none"
            }} 
          />
        </div>
        
        {(name || barcode || location) && (
          <div style={{ 
            background: T.surface2, 
            border: `1px solid ${T.border}`, 
            borderRadius: 12, 
            padding: 14, 
            marginBottom: 18
          }}>
            <div style={{ fontSize: 11.5, color: T.muted, marginBottom: 8, fontWeight: 700, textTransform: "uppercase" }}>ملخص الإدخال</div>
            <div style={{ display: "grid", gridTemplateColumns: "auto 1fr", gap: "6px 12px", fontSize: 13 }}>
              <span style={{ color: T.muted }}>الاسم:</span>
              <span style={{ fontWeight: 600 }}>{name || "—"}</span>
              <span style={{ color: T.muted }}>الباركود:</span>
              <span className="font-mono">{barcode || "—"}</span>
              <span style={{ color: T.muted }}>الموقع:</span>
              <span className="font-mono" style={{ color: T.gold }}>{location || "—"}</span>
              <span style={{ color: T.muted }}>الكمية:</span>
              <span style={{ color: T.green, fontWeight: 700 }}>{qty} وحدة</span>
            </div>
          </div>
        )}
        
        <div style={{ display: "flex", gap: 10 }}>
          <button 
            onClick={onClose} 
            style={{ 
              flex: 1, 
              padding: "12px", 
              borderRadius: 10, 
              border: `1px solid ${T.border}`, 
              background: "transparent", 
              color: T.muted, 
              cursor: "pointer",
              fontWeight: 700,
              fontSize: 14
            }}
          >
            إلغاء
          </button>
          <button 
            onClick={handleSubmit} 
            style={{ 
              flex: 2, 
              padding: "12px", 
              borderRadius: 10, 
              border: "none", 
              background: (!name.trim() || !barcode.trim() || !location || qty < 1) 
                ? T.gray 
                : "linear-gradient(135deg, #3ECF8E 0%, #2BA36F 100%)", 
              color: "#14181F", 
              cursor: (!name.trim() || !barcode.trim() || !location || qty < 1) ? "not-allowed" : "pointer",
              fontWeight: 700,
              fontSize: 15,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 8,
              boxShadow: (!name.trim() || !barcode.trim() || !location || qty < 1) ? "none" : "0 4px 14px rgba(62,207,142,0.3)"
            }}
          >
            <Icon name="check" size={18} color="#14181F" />
            حفظ المنتج
          </button>
        </div>
      </div>
    </div>
  );
}

function NotificationsPanel({ T, products, onClose }) {
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(0,0,0,0.7)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={onClose}>
      <div className="fade-up slide-in" style={{ background: T.surface, borderRadius: 16, padding: 24, width: "100%", maxWidth: 500, maxHeight: "80vh", overflowY: "auto" }} onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <Icon name="warning" size={24} color={T.red} />
            <div className="font-display" style={{ fontSize: 20, fontWeight: 700 }}>تنبيهات المخزون</div>
          </div>
          <button onClick={onClose} style={{ background: "transparent", border: "none", color: T.muted, cursor: "pointer" }}><Icon name="x" size={20} /></button>
        </div>
        
        {products.length === 0 ? (
          <div style={{ textAlign: "center", padding: 40, color: T.muted }}>
            <Icon name="check" size={48} color={T.green} style={{ marginBottom: 10 }} />
            <div>لا توجد تنبيهات - المخزون جيد!</div>
          </div>
        ) : (
          <div>
            <div style={{ fontSize: 13, color: T.muted, marginBottom: 16 }}>{products.length} منتجات على وشك النفاذ (أقل من {LOW_STOCK_THRESHOLD} وحدات)</div>
            {products.map((p, i) => (
              <div key={i} style={{ background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 10, padding: 12, marginBottom: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                  <div style={{ fontWeight: 600 }}>{p.name}</div>
                  <div style={{ color: T.red, fontWeight: 700 }}>{p.qty} وحدات</div>
                </div>
                <div style={{ fontSize: 11.5, color: T.muted }}>
                  <span className="font-mono">{p.barcode}</span> · الموقع: <span style={{ color: T.gold }}>{p.location}</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function Dashboard({ T, products, lowStock }) {

  return (
    <div className="fade-up">
      <div className="font-display" style={{ fontSize: 22, fontWeight: 700, marginBottom: 20 }}>لوحة التحكم</div>

        <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20 }}>
          <Icon name="boxes" size={24} color={T.gold} style={{ marginBottom: 10 }} />
          <div style={{ fontSize: 32, fontWeight: 700, marginBottom: 4 }}>{totalProducts}</div>
          <div style={{ fontSize: 12, color: T.muted }}>إجمالي المنتجات</div>
        </div>
        <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20 }}>
          <Icon name="package" size={24} color={T.green} style={{ marginBottom: 10 }} />
          <div style={{ fontSize: 32, fontWeight: 700, marginBottom: 4 }}>{totalStock}</div>
          <div style={{ fontSize: 12, color: T.muted }}>إجمالي المخزون</div>
        </div>
        <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20 }}>

          <div style={{ fontSize: 32, fontWeight: 700, marginBottom: 4 }}>{lowStock.length}</div>
          <div style={{ fontSize: 12, color: T.muted }}>تنبيهات المخزون</div>
        </div>
        <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20 }}>
          <Icon name="trash" size={24} color={T.muted} style={{ marginBottom: 10 }} />
          <div style={{ fontSize: 32, fontWeight: 700, marginBottom: 4 }}>{outOfStock}</div>
          <div style={{ fontSize: 12, color: T.muted }}>منتجات نفذت (محفوظة)</div>
        </div>
      </div>
      
      {lowStock.length > 0 && (
        <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20, marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
            <Icon name="warning" size={20} color={T.red} />
            <div style={{ fontWeight: 700, fontSize: 16 }}>تنبيهات المخزون المنخفض</div>
          </div>
          {lowStock.slice(0, 5).map((p, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: i < lowStock.length - 1 ? `1px solid ${T.border}` : "none" }}>
              <div>
                <div style={{ fontWeight: 600 }}>{p.name}</div>
                <div style={{ fontSize: 11.5, color: T.muted }}>{p.barcode}</div>
              </div>
              <div style={{ color: T.red, fontWeight: 700 }}>{p.qty} وحدات</div>
            </div>
          ))}
        </div>
      )}

      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
          <Icon name="boxes" size={20} color={T.gold} />
          <div style={{ fontWeight: 700, fontSize: 16 }}>كل المنتجات في التخزين ({products.length})</div>
        </div>
        {products.length === 0 ? (
          <div style={{ textAlign: "center", padding: 30, color: T.muted }}>لا توجد منتجات مسجلة بعد</div>
        ) : (
          products.map((p, i) => {
            const qty = totalQty(p);
            const statusColor = qty === 0 ? T.red : qty <= LOW_STOCK_THRESHOLD ? T.goldBright : T.green;
            const statusText = qty === 0 ? "منتهي" : qty <= LOW_STOCK_THRESHOLD ? "منخفض" : "متوفر";
            return (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, padding: "12px 4px", borderBottom: i < products.length - 1 ? `1px solid ${T.border}` : "none" }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 2 }}>{p.name}</div>
                  <div className="font-mono" style={{ fontSize: 11.5, color: T.muted, marginBottom: 2 }}>{p.barcode}</div>
                  <div style={{ fontSize: 11.5, color: T.muted }}>
                    المواقع: <span style={{ color: T.gold }}>{(p.locations || []).map(l => l.code).join("، ") || "لا يوجد"}</span>
                  </div>
                </div>
                <div style={{ textAlign: "left", flexShrink: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 16, color: statusColor }}>{qty}</div>
                  <div style={{ fontSize: 10.5, color: statusColor }}>{statusText}</div>
                </div>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

function WarehouseMap({ T, locationIndex, onSelect, highlight }) {
  const cellRefs = useRef({});
  useEffect(() => { if (highlight && cellRefs.current[highlight]) cellRefs.current[highlight].scrollIntoView({ behavior: "smooth", block: "center" }); }, [highlight]);
  
  const statusColor = (entries) => {
    if (!entries || entries.length === 0) return T.gray;
    const total = entries.reduce((s, e) => s + (e.qty || 0), 0);
    if (total === 0) return T.red;
    return total <= LOW_STOCK_THRESHOLD ? T.red : T.green;
  };
  
  return (
    <div className="fade-up">
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
        <div className="font-display" style={{ fontSize: 22, fontWeight: 700 }}>خريطة المستودع</div>
        <div style={{ display: "flex", gap: 14 }}>
          {[{c: T.green, l: "متوفر"}, {c: T.red, l: "منخفض/منتهي"}, {c: T.gray, l: "فارغ"}].map(i => (
            <div key={i.l} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: T.muted }}>
              <span style={{ width: 9, height: 9, borderRadius: 3, background: i.c }} /> {i.l}
            </div>
          ))}
        </div>
      </div>
      
      <div className="warehouse-map-container" style={{ background: T.floor, border: `1px solid ${T.border}`, borderRadius: 18, padding: "26px 18px", backgroundImage: `linear-gradient(${T.border}55 1px, transparent 1px), linear-gradient(90deg, ${T.border}55 1px, transparent 1px)`, backgroundSize: "26px 26px", overflowX: "auto" }}>
        <div style={{ display: "flex", alignItems: "stretch", gap: 26, minWidth: 900 }}>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", minWidth: 84 }}>
            <div style={{ width: 56, height: 56, borderRadius: 12, background: T.surface, border: `2px dashed ${T.gold}`, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 8 }}>
              <Icon name="door" size={26} color={T.gold} />
            </div>
            <div className="font-mono" style={{ fontSize: 10.5, color: T.gold, fontWeight: 700 }}>الدخول</div>
          </div>
          
          {SHELVES.map(s => (
            <div key={s.id} className="shelf-block" style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
              <div style={{ fontWeight: 800, fontSize: 22, color: T.gold, marginBottom: 8, width: 32, height: 32, borderRadius: 8, background: "rgba(227,165,72,0.12)", border: `1px solid ${T.gold}55`, display: "flex", alignItems: "center", justifyContent: "center" }}>{s.id}</div>
              <div style={{ display: "flex", gap: 4 }}>
                {Array.from({ length: s.columns }, (_, ci) => (
                  <div key={ci} style={{ display: "flex", flexDirection: "column-reverse", gap: 4 }}>
                    {Array.from({ length: LEVELS }, (_, li) => {
                      const code = `${s.id}${ci + 1}-${li + 1}`;
                      const entries = locationIndex[code] || [];
                      const isHighlight = highlight === code;
                      const productName = entries.length > 0 && entries[0].product ? entries[0].product.name : "";
                      const total = entries.reduce((s, e) => s + (e.qty || 0), 0);
                      return (
                        <div 
                          key={code} 
                          ref={el => cellRefs.current[code] = el} 
                          onClick={() => onSelect(code, productName)} 
                          className={isHighlight ? "glow-long" : ""} 
                          title={entries.length > 0 ? `${entries.map(e => e.product.name).join(", ")} (${total} وحدة)` : "فارغ — انقر للإضافة"} 
                          style={{ 
                            position: "relative",
                            width: 36, 
                            height: 20, 
                            borderRadius: 4, 
                            cursor: "pointer",
                            background: statusColor(entries), 
                            opacity: entries.length === 0 ? 0.35 : 1, 
                            border: isHighlight ? `2px solid ${T.goldBright}` : `1px solid ${T.bg}55` 
                          }}
                        >
                          {entries.length > 1 && <div style={{ position: "absolute", top: -2, right: -2, width: 8, height: 8, background: T.goldBright, borderRadius: "50%" }} />}
                          {entries.length > 0 && total === 0 && (
                            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, color: "#fff" }}>0</div>
                          )}
                        </div>
                      );
                    })}
                    <div className="font-mono" style={{ fontSize: 9, color: T.muted, textAlign: "center" }}>{ci + 1}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function DetailPanel({ T, code, entries, session, onClose, onRemove, onAdd, onRename, onScanBarcode, onDeleteFromLocation }) {
  const safeEntries = entries || [];
  const [mode, setMode] = useState(safeEntries.length > 0 ? "view" : "create");
  const [selectedIdx, setSelectedIdx] = useState(0);
  const [name, setName] = useState("");
  const [barcode, setBarcode] = useState("");
  const [qty, setQty] = useState(1);
  const [worker, setWorker] = useState(session.name);
  const [showAddNew, setShowAddNew] = useState(false);
  const [newName, setNewName] = useState("");
  const [newBarcode, setNewBarcode] = useState("");
  const [newQty, setNewQty] = useState(1);
  const [newWorker, setNewWorker] = useState(session.name);
  const [editingName, setEditingName] = useState(false);
  const [editName, setEditName] = useState("");
  // ✅ جديد: حالة تأكيد حذف المنتج من الموقع
  const [confirmDelete, setConfirmDelete] = useState(false);

  const currentSelectedIdx = selectedIdx >= safeEntries.length ? 0 : selectedIdx;
  const selectedEntry = safeEntries[currentSelectedIdx];
  const isLastLocation = selectedEntry && selectedEntry.product ? (selectedEntry.product.locations || []).length <= 1 : false;

  const handleAddNew = () => {
    if (newName && newBarcode && newWorker && newQty > 0) {
      onAdd(newBarcode, newName, newQty, code, newWorker);
      setShowAddNew(false);
      setNewName(""); setNewBarcode(""); setNewQty(1);
    }
  };

  const handleSaveName = () => {
    const trimmed = editName.trim();
    if (!trimmed || !selectedEntry) return;
    onRename(selectedEntry.product.id, trimmed);
    setEditingName(false);
  };

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 60, display: "flex", justifyContent: "flex-end" }}>
      <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.45)" }} />
      <div className="detail-panel fade-up" style={{ position: "relative", width: 420, maxWidth: "92vw", height: "100%", background: T.surface, borderRight: `1px solid ${T.border}`, padding: 22, overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <div className="font-mono" style={{ color: T.gold, fontWeight: 700 }}>{code}</div>
          <button onClick={onClose} style={{ background: "transparent", border: "none", color: T.muted, cursor: "pointer" }}><Icon name="x" size={18} /></button>
        </div>
        {safeEntries.length > 0 ? (
          <>
            <div style={{ background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 12, padding: 14, marginBottom: 16 }}>
              <div style={{ fontWeight: 700, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}><Icon name="boxes" size={16} color={T.gold} /> المنتجات ({safeEntries.length})</div>
              {safeEntries.map((e, idx) => (
                <div key={idx} onClick={() => { setSelectedIdx(idx); setEditingName(false); setConfirmDelete(false); }} style={{ padding: 10, marginBottom: idx < safeEntries.length - 1 ? 8 : 0, background: currentSelectedIdx === idx ? "rgba(227,165,72,0.1)" : T.surface, border: `1px solid ${currentSelectedIdx === idx ? T.gold : T.border}`, borderRadius: 8, cursor: "pointer" }}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}>
                    <div style={{ fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}>
                      {e.product.name}
                      {e.qty === 0 && <span style={{ fontSize: 10, background: T.red, color: "#fff", padding: "2px 6px", borderRadius: 4, fontWeight: 700 }}>منتهي</span>}
                    </div>
                    <div className="font-mono" style={{ color: e.qty === 0 ? T.red : T.gold }}>{e.qty}</div>
                  </div>
                  <div className="font-mono" style={{ fontSize: 10.5, color: T.muted }}>{e.product.barcode}</div>
                </div>
              ))}
            </div>
            {!showAddNew ? (
              <button onClick={() => setShowAddNew(true)} style={{ width: "100%", padding: "12px", borderRadius: 10, border: `2px dashed ${T.gold}`, background: "rgba(227,165,72,0.08)", color: T.gold, cursor: "pointer", fontWeight: 700, marginBottom: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Icon name="plus" size={18} /> إضافة منتج جديد</button>
            ) : (
              <div style={{ background: "rgba(62,207,142,0.08)", border: `1px solid ${T.green}`, borderRadius: 12, padding: 14, marginBottom: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                  <div style={{ fontWeight: 700, color: T.green }}>منتج جديد</div>
                  <button onClick={() => setShowAddNew(false)} style={{ background: "transparent", border: "none", color: T.muted, cursor: "pointer", fontSize: 18 }}>×</button>
                </div>
                <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="الاسم" style={{ width: "100%", background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, marginBottom: 8 }} />
                <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                  <input value={newBarcode} onChange={e => setNewBarcode(e.target.value)} placeholder="الباركود" className="font-mono" style={{ flex: 1, background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text }} />
                  <button onClick={() => { onScanBarcode(); }} style={{ padding: "8px 12px", borderRadius: 8, border: `1px solid ${T.gold}`, background: "rgba(227,165,72,0.1)", color: T.gold, cursor: "pointer" }}><Icon name="scan" size={16} /></button>
                </div>
                <input type="number" value={newQty} onChange={e => setNewQty(Number(e.target.value))} min="1" placeholder="الكمية" style={{ width: "100%", background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, marginBottom: 8 }} />
                <input value={newWorker} onChange={e => setNewWorker(e.target.value)} placeholder="العامل" style={{ width: "100%", background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, marginBottom: 12 }} />
                <button onClick={handleAddNew} disabled={!newName || !newBarcode || !newWorker || newQty < 1} style={{ width: "100%", padding: 10, borderRadius: 8, border: "none", background: (newName && newBarcode && newWorker && newQty > 0) ? T.green : T.gray, color: "#14181F", fontWeight: 700, cursor: (newName && newBarcode && newWorker && newQty > 0) ? "pointer" : "not-allowed" }}><Icon name="check" size={14} /> تأكيد</button>
              </div>
            )}
            {selectedEntry && selectedEntry.product && (
              <>
                <div style={{ background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 12, padding: 14, marginBottom: 16 }}>
                  {editingName ? (
                    <div style={{ marginBottom: 8 }}>
                      <input 
                        value={editName} 
                        onChange={e => setEditName(e.target.value)} 
                        autoFocus
                        style={{ width: "100%", background: T.surface, border: `1px solid ${T.gold}`, borderRadius: 8, padding: 8, color: T.text, fontWeight: 700, fontSize: 15, marginBottom: 8, outline: "none" }} 
                      />
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={handleSaveName} disabled={!editName.trim()} style={{ flex: 1, padding: 8, borderRadius: 8, border: "none", background: editName.trim() ? T.green : T.gray, color: "#14181F", fontWeight: 700, cursor: editName.trim() ? "pointer" : "not-allowed", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Icon name="check" size={14} /> حفظ</button>
                        <button onClick={() => { setEditingName(false); setEditName(selectedEntry.product.name); }} style={{ flex: 1, padding: 8, borderRadius: 8, border: `1px solid ${T.border}`, background: "transparent", color: T.muted, fontWeight: 700, cursor: "pointer" }}>إلغاء</button>
                      </div>
                    </div>
                  ) : (
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                      <div style={{ fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", gap: 6 }}>
                        {selectedEntry.product.name}
                        {selectedEntry.qty === 0 && <span style={{ fontSize: 11, background: T.red, color: "#fff", padding: "3px 8px", borderRadius: 4, fontWeight: 700 }}>منتهي</span>}
                      </div>
                      <button onClick={() => { setEditName(selectedEntry.product.name); setEditingName(true); }} style={{ background: "rgba(227,165,72,0.1)", border: `1px solid ${T.gold}`, borderRadius: 7, padding: "5px 9px", color: T.gold, cursor: "pointer", display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, fontWeight: 700 }}><Icon name="edit" size={12} /> تعديل الاسم</button>
                    </div>
                  )}
                  <div className="font-mono" style={{ fontSize: 11.5, color: T.muted, marginBottom: 8 }}>{selectedEntry.product.barcode}</div>
                  <div style={{ fontSize: 18, fontWeight: 700, color: selectedEntry.qty === 0 ? T.red : T.gold }}>{selectedEntry.qty} <span style={{ fontSize: 12, color: T.muted, fontWeight: 400 }}>وحدة</span></div>
                  
                  {/* ✅ جديد: زر حذف المنتج من هذا الموقع مع تأكيد */}
                  <div style={{ marginTop: 12 }}>
                    {!confirmDelete ? (
                      <button 
                        onClick={() => setConfirmDelete(true)} 
                        style={{ 
                          width: "100%", 
                          padding: 9, 
                          borderRadius: 8, 
                          border: `1px solid ${T.red}`, 
                          background: "rgba(240,85,95,0.08)", 
                          color: T.red, 
                          cursor: "pointer", 
                          fontWeight: 700, 
                          display: "flex", 
                          alignItems: "center", 
                          justifyContent: "center", 
                          gap: 6, 
                          fontSize: 12.5 
                        }}
                      >
                        <Icon name="trash" size={14} /> حذف المنتج من هذا الموقع
                      </button>
                    ) : (
                      <div className="fade-up" style={{ background: "rgba(240,85,95,0.1)", border: `1px solid ${T.red}`, borderRadius: 10, padding: 12 }}>
                        <div style={{ fontSize: 12.5, color: T.red, fontWeight: 700, marginBottom: 10, lineHeight: 1.6 }}>
                          {isLastLocation 
                            ? `⚠️ هذا الموقع الوحيد للمنتج "${selectedEntry.product.name}" — سيتم حذفه نهائياً من النظام!` 
                            : `حذف "${selectedEntry.product.name}" من الموقع ${code}؟ سيبقى في مواقعه الأخرى.`}
                        </div>
                        <div style={{ display: "flex", gap: 8 }}>
                          <button 
                            onClick={() => { onDeleteFromLocation(selectedEntry.product.id, code, worker); setConfirmDelete(false); }} 
                            style={{ flex: 1, padding: 8, borderRadius: 8, border: "none", background: T.red, color: "#fff", fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 12.5 }}
                          >
                            <Icon name="trash" size={13} /> نعم، احذف
                          </button>
                          <button 
                            onClick={() => setConfirmDelete(false)} 
                            style={{ flex: 1, padding: 8, borderRadius: 8, border: `1px solid ${T.border}`, background: "transparent", color: T.muted, fontWeight: 700, cursor: "pointer", fontSize: 12.5 }}
                          >
                            إلغاء
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 4, background: T.surface2, borderRadius: 10, padding: 4, marginBottom: 16 }}>
                  {[["view", "تفاصيل"], ["add", "إضافة"], ["remove", "سحب"]].map(([id, label]) => (
                    <button key={id} onClick={() => setMode(id)} style={{ flex: 1, padding: 7, borderRadius: 7, border: "none", background: mode === id ? T.surface : "transparent", color: mode === id ? T.text : T.muted, cursor: "pointer", fontWeight: 600 }}>{label}</button>
                  ))}
                </div>
                {mode === "add" && (
                  <div>
                    <input value={worker} onChange={e => setWorker(e.target.value)} placeholder="العامل" style={{ width: "100%", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, marginBottom: 8 }} />
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                      <button onClick={() => setQty(Math.max(1, qty - 1))} style={{ width: 30, height: 30, borderRadius: 6, border: `1px solid ${T.border}`, background: T.surface2, color: T.text, cursor: "pointer" }}>−</button>
                      <input type="number" value={qty} onChange={e => setQty(Math.max(1, Number(e.target.value)))} min="1" style={{ width: 60, textAlign: "center", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 6, padding: 6, color: T.text }} />
                      <button onClick={() => setQty(qty + 1)} style={{ width: 30, height: 30, borderRadius: 6, border: `1px solid ${T.border}`, background: T.surface2, color: T.text, cursor: "pointer" }}>+</button>
                    </div>
                    <button onClick={() => { 
                      onAdd(selectedEntry.product.barcode, selectedEntry.product.name, qty, code, worker); 
                      onClose(); 
                    }} style={{ width: "100%", padding: 10, borderRadius: 8, border: "none", background: T.green, color: "#14181F", fontWeight: 700, cursor: "pointer" }}><Icon name="plus" size={14} /> إضافة</button>
                  </div>
                )}
                {mode === "remove" && (
                  <div>
                    {selectedEntry.qty === 0 ? (
                      <div style={{ padding: 20, textAlign: "center", background: "rgba(240,85,95,0.1)", borderRadius: 10, border: `1px solid ${T.red}` }}>
                        <Icon name="alert" size={32} color={T.red} style={{ marginBottom: 8 }} />
                        <div style={{ color: T.red, fontWeight: 700, marginBottom: 4 }}>لا يمكن السحب</div>
                        <div style={{ fontSize: 12, color: T.muted }}>الكمية المتوفرة = 0 (المنتج نفذ)</div>
                      </div>
                    ) : (
                      <>
                        <input value={worker} onChange={e => setWorker(e.target.value)} placeholder="العامل" style={{ width: "100%", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, marginBottom: 8 }} />
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                          <button onClick={() => setQty(Math.max(1, qty - 1))} style={{ width: 30, height: 30, borderRadius: 6, border: `1px solid ${T.border}`, background: T.surface2, color: T.text, cursor: "pointer" }}>−</button>
                          <input type="number" value={qty} onChange={e => setQty(Math.max(1, Math.min(selectedEntry.qty, Number(e.target.value))))} min="1" max={selectedEntry.qty} style={{ width: 60, textAlign: "center", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 6, padding: 6, color: T.text }} />
                          <button onClick={() => setQty(Math.min(selectedEntry.qty, qty + 1))} style={{ width: 30, height: 30, borderRadius: 6, border: `1px solid ${T.border}`, background: T.surface2, color: T.text, cursor: "pointer" }}>+</button>
                        </div>
                        <button onClick={() => { onRemove(selectedEntry.product.id, code, qty, worker); onClose(); }} style={{ width: "100%", padding: 10, borderRadius: 8, border: "none", background: T.red, color: "#fff", fontWeight: 700, cursor: "pointer" }}><Icon name="minus" size={14} /> سحب</button>
                      </>
                    )}
                  </div>
                )}
                {mode === "view" && (selectedEntry.product.history || []).length > 0 && (
                  <div>
                    <div style={{ fontWeight: 600, marginBottom: 8, color: T.muted }}>آخر الحركات</div>
                    {(selectedEntry.product.history || []).slice(0, 5).map((h, i) => (
                      <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${T.border}`, fontSize: 12 }}>
                        <span style={{ color: h.action === "ADD" ? T.green : T.red }}>{h.action === "ADD" ? "+" : "-"}{h.qty}</span>
                        <span style={{ color: T.muted }}>{new Date(h.ts).toLocaleDateString('ar')}</span>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}
          </>
        ) : (
          <div>
            <div style={{ background: T.surface2, border: `1px dashed ${T.border}`, borderRadius: 12, padding: 14, marginBottom: 16, textAlign: "center", color: T.muted }}>مكان فارغ</div>
            <input value={name} onChange={e => setName(e.target.value)} placeholder="الاسم" style={{ width: "100%", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, marginBottom: 8 }} />
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <input value={barcode} onChange={e => setBarcode(e.target.value)} placeholder="الباركود" className="font-mono" style={{ flex: 1, background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text }} />
              <button onClick={() => { onScanBarcode(); }} style={{ padding: "8px 12px", borderRadius: 8, border: `1px solid ${T.gold}`, background: "rgba(227,165,72,0.1)", color: T.gold, cursor: "pointer" }}><Icon name="scan" size={16} /></button>
            </div>
            <input type="number" value={qty} onChange={e => setQty(Number(e.target.value))} min="1" placeholder="الكمية" style={{ width: "100%", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, marginBottom: 8 }} />
            <input value={worker} onChange={e => setWorker(e.target.value)} placeholder="العامل" style={{ width: "100%", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, marginBottom: 12 }} />
            <button onClick={() => { if (name && barcode && worker && qty > 0) { onAdd(barcode, name, qty, code, worker); onClose(); } }} disabled={!name || !barcode || !worker || qty < 1} style={{ width: "100%", padding: 10, borderRadius: 8, border: "none", background: (name && barcode && worker && qty > 0) ? T.gold : T.gray, color: "#14181F", fontWeight: 700, cursor: (name && barcode && worker && qty > 0) ? "pointer" : "not-allowed" }}><Icon name="plus" size={14} /> إنشاء</button>
          </div>
        )}
      </div>
    </div>
  );
}

function ScanWithdrawalPanel({ T, barcode, products, session, onClose, onConfirm }) {
  const existing = products.find(p => p.barcode === barcode);
  const [qty, setQty] = useState(1);
  const [worker, setWorker] = useState(session.name);
  const [location, setLocation] = useState("");
  
  useEffect(() => {
    if (existing && existing.locations && existing.locations.length > 0) {
      const availableLocations = existing.locations.filter(l => l.qty > 0);
      if (availableLocations.length > 0) {
        setLocation(availableLocations[0].code);
      }
    }
  }, [existing]);

  if (!existing) {
    return (
      <div style={{ position: "fixed", inset: 0, zIndex: 70, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
        <div className="fade-up" style={{ background: T.surface, borderRadius: 16, padding: 22, width: 400, maxWidth: "100%" }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
            <div style={{ fontWeight: 700 }}>المنتج غير موجود</div>
            <button onClick={onClose} style={{ background: "transparent", border: "none", color: T.muted, cursor: "pointer" }}><Icon name="x" size={18} /></button>
          </div>
          <div className="font-mono" style={{ color: T.gold, marginBottom: 16 }}>{barcode}</div>
          <div style={{ color: T.muted, textAlign: "center", padding: 20 }}>هذا الباركود غير مسجل في النظام</div>
          <button onClick={onClose} style={{ width: "100%", padding: 10, borderRadius: 8, border: "none", background: T.gold, color: "#14181F", fontWeight: 700, cursor: "pointer" }}>إغلاق</button>
        </div>
      </div>
    );
  }

  const availableStock = totalQty(existing);
  const availableLocations = (existing.locations || []).filter(l => l.qty > 0);
  const isOutOfStock = availableStock === 0;

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 70, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div className="fade-up" style={{ background: T.surface, borderRadius: 16, padding: 22, width: 400, maxWidth: "100%" }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
          <div style={{ fontWeight: 700, fontSize: 18 }}>سحب منتج</div>
          <button onClick={onClose} style={{ background: "transparent", border: "none", color: T.muted, cursor: "pointer" }}><Icon name="x" size={18} /></button>
        </div>
        <div className="font-mono" style={{ color: T.gold, marginBottom: 16 }}>{barcode}</div>
        
        <div style={{ background: T.surface2, borderRadius: 10, padding: 12, marginBottom: 16 }}>
          <div style={{ fontWeight: 600, fontSize: 16, marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}>
            {existing.name}
            {isOutOfStock && <span style={{ fontSize: 11, background: T.red, color: "#fff", padding: "3px 8px", borderRadius: 4, fontWeight: 700 }}>منتهي</span>}
          </div>
          <div style={{ fontSize: 12, color: T.muted }}>المخزون المتاح: <span style={{ color: isOutOfStock ? T.red : T.green, fontWeight: 700 }}>{availableStock}</span> وحدة</div>
        </div>

        {isOutOfStock ? (
          <div style={{ padding: 24, textAlign: "center", background: "rgba(240,85,95,0.1)", border: `1px solid ${T.red}`, borderRadius: 10, marginBottom: 16 }}>
            <Icon name="alert" size={40} color={T.red} style={{ marginBottom: 10 }} />
            <div style={{ fontWeight: 700, color: T.red, fontSize: 16, marginBottom: 6 }}>لا يمكن السحب</div>
            <div style={{ fontSize: 13, color: T.muted }}>
              نفذت كمية المنتج تماماً.<br/>
              المنتج محفوظ بموقعه — يمكنك إضافة كمية جديدة.
            </div>
          </div>
        ) : (
          <>
            <div style={{ fontSize: 11.5, color: T.muted, marginBottom: 5 }}>الموقع</div>
            <select value={location} onChange={e => setLocation(e.target.value)} style={{ width: "100%", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, marginBottom: 12, outline: "none" }}>
              {availableLocations.map(l => (
                <option key={l.code} value={l.code}>{l.code} ({l.qty} وحدة)</option>
              ))}
            </select>

            <div style={{ fontSize: 11.5, color: T.muted, marginBottom: 5 }}>اسم العامل</div>
            <input value={worker} onChange={e => setWorker(e.target.value)} style={{ width: "100%", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, marginBottom: 12 }} />

            <div style={{ fontSize: 11.5, color: T.muted, marginBottom: 5 }}>الكمية</div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16 }}>
              <button onClick={() => setQty(Math.max(1, qty - 1))} style={{ width: 36, height: 36, borderRadius: 8, border: `1px solid ${T.border}`, background: T.surface2, color: T.text, cursor: "pointer", fontSize: 18 }}>−</button>
              <input type="number" value={qty} onChange={e => setQty(Math.max(1, Math.min(availableStock, Number(e.target.value))))} min="1" max={availableStock} style={{ flex: 1, textAlign: "center", background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, fontSize: 16 }} />
              <button onClick={() => setQty(Math.min(availableStock, qty + 1))} style={{ width: 36, height: 36, borderRadius: 8, border: `1px solid ${T.border}`, background: T.surface2, color: T.text, cursor: "pointer", fontSize: 18 }}>+</button>
            </div>

            <div style={{ fontSize: 11.5, color: T.muted, marginBottom: 8 }}>التوقيت</div>
            <div style={{ background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, marginBottom: 16, fontFamily: "monospace" }}>
              {new Date().toLocaleString('ar', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}
            </div>

            <button onClick={() => onConfirm(existing.id, location, qty, worker)} disabled={!location || qty < 1 || !worker.trim()} style={{ width: "100%", padding: 12, borderRadius: 8, border: "none", background: (!location || qty < 1 || !worker.trim()) ? T.gray : T.red, color: "#fff", fontWeight: 700, cursor: (!location || qty < 1 || !worker.trim()) ? "not-allowed" : "pointer", fontSize: 16 }}>
              <Icon name="minus" size={16} style={{ marginRight: 8, verticalAlign: "middle" }} />
              تأكيد السحب
            </button>
          </>
        )}
        
        <button onClick={onClose} style={{ width: "100%", padding: 10, borderRadius: 8, border: `1px solid ${T.border}`, background: "transparent", color: T.muted, fontWeight: 700, cursor: "pointer", marginTop: 8 }}>إغلاق</button>
      </div>
    </div>
  );
}

function BarcodeScanner({ T, session, onClose, onDetected }) {
  const videoRef = useRef(null);
  const [manual, setManual] = useState("");
  const [supported, setSupported] = useState(true);
  useEffect(() => {
    let stream, detector, stopped = false;
    async function start() {
      if (!("BarcodeDetector" in window)) { setSupported(false); return; }
      try {
        detector = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "code_128"] });
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (stopped) return;
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
        const loop = async () => {
          if (stopped) return;
          try {
            const codes = await detector.detect(videoRef.current);
            if (codes.length > 0) { onDetected(codes[0].rawValue); return; }
          } catch {}
          requestAnimationFrame(loop);
        };
        loop();
      } catch (e) { setSupported(false); }
    }
    start();
    return () => { stopped = true; if (stream) stream.getTracks().forEach(t => t.stop()); };
  }, [onDetected]);
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 70, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div className="fade-up" style={{ background: T.surface, borderRadius: 16, padding: 20, width: 380, maxWidth: "100%" }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
          <div style={{ fontWeight: 700, display: "flex", alignItems: "center", gap: 7 }}><Icon name="scan" size={16} color={T.gold} /> مسح الباركود</div>
          <button onClick={onClose} style={{ background: "transparent", border: "none", color: T.muted, cursor: "pointer" }}><Icon name="x" size={18} /></button>
        </div>
        {supported ? (
          <div style={{ position: "relative", borderRadius: 12, overflow: "hidden", background: "#000", aspectRatio: "4/3" }}>
            <video ref={videoRef} muted playsInline style={{ width: "100%", height: "100%", objectFit: "cover" }} />
            <div style={{ position: "absolute", inset: "20%", border: `2px solid ${T.gold}`, borderRadius: 10 }} />
          </div>
        ) : (
          <div style={{ fontSize: 12.5, color: T.muted, marginBottom: 10 }}>المسح غير مدعوم. أدخل يدوياً:</div>
        )}
        <div style={{ marginTop: 14, display: "flex", gap: 8 }}>
          <input value={manual} onChange={e => setManual(e.target.value)} placeholder="الباركود" className="font-mono" style={{ flex: 1, background: T.surface2, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text }} />
          <button disabled={!manual.trim()} onClick={() => onDetected(manual.trim())} style={{ padding: "8px 16px", borderRadius: 8, border: "none", background: manual.trim() ? T.gold : T.gray, color: "#14181F", fontWeight: 700, cursor: manual.trim() ? "pointer" : "not-allowed" }}><Icon name="check" size={15} /></button>
        </div>
      </div>
    </div>
  );
}

function HistoryPanel({ T, history }) {
  return (
    <div className="fade-up">
      <div className="font-display" style={{ fontSize: 22, fontWeight: 700, marginBottom: 4 }}>سجل الحركات</div>
      <div style={{ fontSize: 13, color: T.muted, marginBottom: 16 }}>جميع العمليات</div>
      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, overflow: "hidden" }}>
        {history.length === 0 ? (
          <div style={{ padding: 20, color: T.muted, textAlign: "center" }}>لا توجد حركات</div>
        ) : (
          history.map((h, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 16px", borderBottom: i < history.length - 1 ? `1px solid ${T.border}` : "none" }}>
              <div style={{ width: 30, height: 30, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", background: h.action === "ADD" ? "rgba(62,207,142,0.15)" : "rgba(240,85,95,0.15)", color: h.action === "ADD" ? T.green : T.red }}>
                <Icon name={h.action === "ADD" ? "plus" : "minus"} size={15} />
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600 }}>{h.productName}</div>
                <div style={{ fontSize: 11.5, color: T.muted }}>{h.worker} · {h.location}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontWeight: 700, color: h.action === "ADD" ? T.green : T.red }}>{h.action === "ADD" ? "+" : "-"}{h.qty}</div>
                <div style={{ fontSize: 10.5, color: T.muted }}>{new Date(h.ts).toLocaleDateString('ar')}</div>
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

function Toast({ T, toast }) {
  return (
    <div className="fade-up slide-in" style={{ position: "fixed", bottom: 22, left: "50%", transform: "translateX(-50%)", zIndex: 80, background: T.surface, border: `1px solid ${toast.kind === "warn" ? T.red : T.green}`, borderRadius: 12, padding: "10px 18px", fontSize: 13, fontWeight: 600, color: T.text, boxShadow: "0 10px 30px rgba(0,0,0,.35)" }}>{toast.msg}</div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <ErrorBoundary>
    <WarehouseApp />
  </ErrorBoundary>
);
</script>
